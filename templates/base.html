<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>
      {% block title %}EventHub // Scale Events Instantly{% endblock %}
    </title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}" />
  </head>
  <body>
    <!-- Header / Nav -->
    <header class="navbar">
      <div class="container nav-container">
        <a href="{% url 'event_list' %}" class="nav-brand"
          >Event<span>Hub</span></a
        >
        <nav class="nav-actions">
          <a href="{% url 'event_list' %}" class="nav-link">Explore</a>
          {% if user.is_authenticated %}
          <a href="{% url 'event_create' %}" class="btn btn-primary btn-sm"
            >+ Create Event</a
          >
          {% else %}
          <a href="/admin/login/" class="btn btn-secondary btn-sm">Sign In</a>
          {% endif %}
        </nav>
      </div>
    </header>

    <!-- Main Content -->
    <main class="container">{% block content %}{% endblock %}</main>

    <!-- Client Interactivity JS -->
    <script src="{% static 'js/app.js' %}"></script>
  </body>
</html>

{% extends 'base.html' %} {% block title %}{{ title }} — EventHub{% endblock %}
{% block content %}
<div class="card form-container">
  <h2 style="margin-bottom: 1.5rem; font-weight: 700; letter-spacing: -0.02em">
    {{ title }}
  </h2>

  <form method="POST" novalidate>
    {% csrf_token %} {% for field in form %}
    <div class="form-group">
      <label for="{{ field.id_for_label }}" class="form-label"
        >{{ field.label }}</label
      >
      {{ field }} {% if field.errors %}
      <div
        style="
          color: var(--status-danger);
          font-size: 0.8rem;
          margin-top: 0.35rem;
        "
      >
        {{ field.errors.0 }}
      </div>
      {% endif %}
    </div>
    {% endfor %}

    <button
      type="submit"
      class="btn btn-primary btn-block"
      style="margin-top: 1rem"
    >
      Publish Event
    </button>
  </form>
</div>
{% endblock %}
